name: win cc probe
on:
  push:
    branches:
    - 'win-probe'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: 'windows-${{ matrix.cc }}'
    runs-on: windows-2025
    steps:
      - name: set `core.autocrlf` to false
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Disable Defender real-time scan for workspace (Windows)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\nimcache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
          foreach ($p in @('nim.exe','nimony.exe','nimsem.exe','hexer.exe','lengc.exe','nifler.exe','nifmake.exe','nj.exe','vl.exe','validator.exe','dagon.exe','controlflow.exe','contracts.exe','hastur.exe','tester.exe','gcc.exe','g++.exe','ld.exe','as.exe','ar.exe','make.exe','clang.exe','ld.lld.exe')) {
            Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
          }

      - name: Checkout nimony
        uses: actions/checkout@v7
        with:
          path: nimony
          submodules: false

      - name: Checkout nativenif (sibling of nimony)
        uses: actions/checkout@v7
        with:
          repository: nim-lang/nativenif
          path: nativenif
          submodules: false

      - name: Restore MinGW-W64 (Windows) from cache
        id: windows-mingw-cache
        uses: actions/cache@v5
        with:
          path: external/mingw-amd64
          key: 'mingw-amd64-gcc14-llvm19'

      - name: Restore Nim DLLs dependencies (Windows) from cache
        id: windows-dlls-cache
        uses: actions/cache@v5
        with:
          path: external/dlls-amd64
          key: 'dlls-amd64'

      - name: Install MinGW64 dependency (Windows)
        if: steps.windows-mingw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p external
          MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
          curl -L "$MINGW_URL" -o "external/mingw-amd64.7z"
          7z x -y "external/mingw-amd64.7z" -oexternal/
          mv external/mingw64 external/mingw-amd64

      - name: Install DLLs dependencies (Windows)
        if: steps.windows-dlls-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p external
          curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
          7z x -y external/windeps.zip -oexternal/dlls-amd64

      - name: Path to cached dependencies (Windows)
        shell: bash
        run: |
          echo '${{ github.workspace }}'"/external/mingw-amd64/bin" >> $GITHUB_PATH
          echo '${{ github.workspace }}'"/external/dlls-amd64" >> $GITHUB_PATH

      - name: Install make dependencies with chocolatey (Windows)
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install make

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: devel
          architecture: amd64

      - name: Overlay current Nim compiler source (devel parser fixes)
        shell: bash
        run: |
          git clone --depth 1 --branch devel https://github.com/nim-lang/Nim nim-src
          cp -a nim-src/compiler/. nim/compiler/

      - name: Create dist/nimony symlink for Nim compiler
        shell: bash
        run: |
          rm -rf nim/dist/nimony
          mkdir -p nim/dist
          ln -sf "${{ github.workspace }}/nimony" nim/dist/nimony

      - name: Build toolchain
        run: |
          cd nimony
          nim c -r src/hastur --release build all

      - name: Run tester
        env:
          NIMONY_CC: ${{ matrix.cc == 'clang' && 'clang' || '' }}
        run: |
          cd nimony
          nim c -r tools/tester.nim
